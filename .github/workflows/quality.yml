name: Build and editorial checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    # Full bilingual builds and browser checks exceed 15 minutes on a cold runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - name: Install Chromium before unit and end-to-end browser tests
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e "import { chromium } from '@playwright/test'; console.log('CHROMIUM_PATH=' + chromium.executablePath())" >> "$GITHUB_ENV"
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run build:release
      - run: npm run test:release
      - run: npm run editorial:report > editorial-report.json
        if: always()
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: quality-evidence
          path: |
            editorial-report.json
            test-results/
# Deliberately no cron and no AI APIs. CI verifies files; it does not write articles.
# Cloudflare Git integration must use npm run build:release, output dist.
